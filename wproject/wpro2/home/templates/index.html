<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>메인페이지</title>
    <script>
        function sendBtn(){
            const send_data = $('#data').val(); // input 데이터 가쟈오기
            console.log('데이터:'+send_data); // view.py 데이터 전달

            $.ajax({
                url:'/ajax_data/',
                type:'post',
                headers:{'X-CSRFToken':'{{csrf_token}}'},
                data:{'data':send_data},
                dataType:'json',
                success:function(data){
                    alert('상공')
                    console.log(data)
                    const chart_data = data.result_data
                    $('#result').text(send_data)
                    $('#result2').text(data.result_data)
                    const ctx = document.getElementById('myChart');

                    let chartStatus = Chart.getChart("myChart");
                    if(chartStatus != undefined){
                    console.log("destroy success");
                    chartStatus.destroy();//리셋
                    }//라셋
                    
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                        labels: data.labels,
                        datasets: [{
                        label: '확률(%)',
                        data: data.proba,
                        borderWidth: 1,
                        barThickness:50 // 막대두께 50px 고정
                                }]//datasets
                        },//data
                        options: {
                        scales: {
                        y: {
                        beginAtZero: true
                        }//y
                        }//scales
                    }//option
                    });//chart
                },//success
                error:function(){
                    alert('예측하는데 오류가 발생했습니다. 다시 시도해주세요.')
                }//error
            });//ajax
        }//sendBtn
    </script>
</head>
<body>
    <h1>메인페이지</h1>
    <label for="">생선의 무게,길이,대각선,높이,넓이를 입력하세요</label><br><br>
    <input type="text" name="data" id="data">
    <button type="button" onclick = 'sendBtn()'>예측</button>
    <div>입력데이터: <span id='result'>데이터 입력</span></div>
    <div>예측생선: <span id='result2'>-</span></div>
</body>
</html>
